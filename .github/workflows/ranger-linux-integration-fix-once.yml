name: Ranger Linux Integration Repair

on:
  push:
    branches: [ranger/v0.001]
    paths:
      - .github/workflows/ranger-linux-integration-fix-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ranger/v0.001
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Apply Ranger compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1. Upstream generator validation requires every skill description
          # to contain the literal token "gstack". Keep description compact so
          # the catalog budget remains stable.
          p = Path('ranger/SKILL.md.tmpl')
          s = p.read_text()
          old = 'description: Ranger authority and routing gate.'
          new = 'description: gstack Ranger authority routing gate.'
          if old not in s:
              raise SystemExit('expected ranger description not found')
          p.write_text(s.replace(old, new, 1))

          # 2. Preserve the inherited router contract name while keeping
          # Ranger explicit-only semantics. Restore one best-effort telemetry
          # call; Ranger setup keeps telemetry tier off, so the logger no-ops.
          p = Path('SKILL.md.tmpl')
          s = p.read_text()
          old = '## Ranger explicit-routing rule\n'
          new = '## Route first\n\n### Ranger explicit-routing rule\n'
          if old not in s:
              raise SystemExit('expected Ranger router heading not found')
          s = s.replace(old, new, 1)
          needle = '`PROACTIVE=true` from an inherited/stale configuration does not override this Ranger rule. Ranger setup writes `proactive=false`, but this template is deliberately fail-safe even if that config is missing or stale.\n'
          insertion = needle + '\nBest-effort route telemetry remains compatible with upstream, but Ranger defaults telemetry to off; the logger therefore exits without emission unless the operator explicitly changes that setting:\n```bash\n~/.claude/skills/gstack/bin/gstack-telemetry-log --event-type route --skill gstack --outcome direct --session-id "$_SESSION_ID" 2>/dev/null || true\n```\n'
          if needle not in s:
              raise SystemExit('expected proactive compatibility paragraph not found')
          p.write_text(s.replace(needle, insertion, 1))

          # 3-4. Add /ranger to both user-facing skill inventories. The
          # inventory tests only require the invocation token, but the row also
          # documents its actual role.
          p = Path('AGENTS.md')
          s = p.read_text()
          needle = '### Plan-mode reviews\n\n| Skill | What it does |\n'
          replacement = '### Ranger control plane\n\n| Skill | What it does |\n|-------|-------------|\n| `/ranger` | Explicit specialist selector and R0–R6 mission-authority gate for Ranger Stack. |\n\n' + needle
          if needle not in s:
              raise SystemExit('AGENTS inventory insertion point not found')
          p.write_text(s.replace(needle, replacement, 1))

          p = Path('docs/skills.md')
          s = p.read_text()
          needle = '|-------|----------------|--------------|\n'
          replacement = needle + '| [`/ranger`](../ranger/SKILL.md) | **Ranger Control Plane** | Explicit specialist selector and R0–R6 mission-authority gate. |\n'
          if needle not in s:
              raise SystemExit('docs/skills inventory insertion point not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate tracked skill docs
        run: bun run gen:skill-docs --host all

      - name: Run exact Ranger integration regressions
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            test/ranger-policy.test.ts \
            test/audit-compliance.test.ts \
            test/skill-validation.test.ts \
            test/gen-skill-docs.test.ts \
            test/catalog-budget.test.ts \
            test/context-budget-ratchet.test.ts \
            test/skill-coverage-matrix.test.ts \
            test/skill-coverage-floor.test.ts

      - name: Commit only validated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            SKILL.md.tmpl SKILL.md \
            ranger/SKILL.md.tmpl ranger/SKILL.md \
            AGENTS.md docs/skills.md gstack/llms.txt
          if git diff --cached --quiet; then
            echo "No Ranger integration changes required."
            exit 0
          fi
          git config user.name "Ranger Stack CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: satisfy inherited Ranger integration contracts"
          git push origin HEAD:ranger/v0.001
