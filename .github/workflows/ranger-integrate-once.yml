name: Ranger One-Shot E2E Candidate

on:
  push:
    branches: [ranger/v0.001]
    paths:
      - .github/workflows/ranger-integrate-once.yml

permissions:
  contents: write

jobs:
  export-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ranger/v0.001
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build exact manual-only E2E candidate from upstream
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/evals.yml > .github/workflows/evals.yml
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/evals.yml')
          s = p.read_text()
          old = "on:\n  pull_request:\n    branches: [main]\n  workflow_dispatch:\n"
          new = "on:\n  workflow_dispatch:\n"
          if old not in s:
              raise SystemExit('expected upstream evals trigger block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify inherited E2E wiring remains intact
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test test/evals-workflow-wiring.test.ts test/ci-image-tag-binding.test.ts

      - name: Commit exact candidate under a temporary non-workflow path
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/evals.yml ranger/evals.manual.candidate.yml
          git add -- ranger/evals.manual.candidate.yml
          git config user.name "Ranger Stack CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci: export tested manual E2E workflow candidate"
          git push origin HEAD:ranger/v0.001
