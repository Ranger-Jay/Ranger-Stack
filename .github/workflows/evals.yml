name: Paid E2E Evals — Ranger Parked

# Ranger Stack v0.001 intentionally does not run provider-backed evals on PRs.
# The upstream workflow depended on upstream runner infrastructure and could
# invoke paid/model-backed evaluation paths from same-repository branches.
# Ranger's TOKEN SAVER doctrine requires comparable evidence, an explicit
# provider/cost policy, and human authority before paid evaluation is enabled.
# The original upstream workflow remains available in repository history at
# the pinned upstream anchor documented in docs/ranger-stack/UPSTREAM_ANCHOR.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parked:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain Ranger v0.001 policy
        run: |
          echo "Paid/provider-backed E2E evals are intentionally parked in Ranger Stack v0.001."
          echo "Secretless Free Tests, Quality, Skill Docs, Workflow Lint, and Windows Free Tests remain the PR verification lanes."
          echo "Re-enable provider-backed evals only through a reviewed Ranger policy change with explicit cost and authority controls."
